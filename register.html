<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - VAA English</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="bg-success-subtle text-success rounded-circle d-inline-flex p-3 mb-2">
                            <i class="bi bi-person-plus fs-2"></i>
                        </div>
                        <h3 class="fw-bold">Tạo Tài Khoản Mới</h3>
                        <p class="text-muted small">Đăng ký để bắt đầu trải nghiệm khóa học tại trung tâm</p>
                    </div>
                    <form
                        onsubmit="event.preventDefault(); alert('Đăng ký tài khoản thành công! Vui lòng đăng nhập.'); window.location.href='login.html';">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Họ và Tên học viên</label>
                            <input type="text" class="form-control" placeholder="Ví dụ: Văn Thái Sơn" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Địa chỉ Email</label>
                            <input type="email" class="form-control" placeholder="sonvt@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Số điện thoại liên hệ</label>
                            <input type="tel" class="form-control" placeholder="0901234567" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm mb-3">Đăng Ký Tài
                            Khoản</button>
                        <div class="text-center">
                            <span class="text-muted small">Đã có tài khoản? </span>
                            <a href="login.html" class="text-decoration-none fw-semibold small">Đăng nhập tại đây</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

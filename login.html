<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống - VAA English</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-2">
                            <i class="bi bi-shield-lock fs-2"></i>
                        </div>
                        <h3 class="fw-bold">Đăng Nhập Hệ Thống</h3>
                        <p class="text-muted small">Quản lý trung tâm & Cổng học viên</p>
                    </div>
                    <form
                        onsubmit="event.preventDefault(); let role=document.getElementById('userRole').value; if(role==='admin') { alert('Đăng nhập thành công với quyền Admin!'); window.location.href='hoc-vien.php'; } else { alert('Đăng nhập thành công!'); window.location.href='home-public.html'; }">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phân quyền đăng nhập</label>
                            <select class="form-select" id="userRole">
                                <option value="admin">Quản Trị Viên (Admin / Staff)</option>
                                <option value="student">Học Viên</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên đăng nhập / Email</label>
                            <input type="text" class="form-control" placeholder="admin@vaa.edu.vn" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">Đăng
                            Nhập</button>
                        <div class="text-center">
                            <span class="text-muted small">Chưa có tài khoản? </span>
                            <a href="register.html" class="text-decoration-none fw-semibold small">Đăng ký ngay</a>
                            <div class="mt-2">
                                <a href="home-public.html" class="text-decoration-none text-secondary small"><i
                                        class="bi bi-arrow-left me-1"></i> Quay lại trang chủ</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
